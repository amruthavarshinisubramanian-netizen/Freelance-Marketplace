<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In - FreelanceHub</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="main-nav"></div>

  <div class="auth-wrapper">
    <div class="auth-card">
      <h2>Welcome Back</h2>
      <p class="subtitle">Log in to your FreelanceHub account</p>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="name@company.com" required autofocus>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" id="login-submit-btn" class="btn btn-primary btn-block btn-lg" style="margin-top: 1rem;">
          Sign In
        </button>
      </form>

      <div class="demo-credentials-box">
        <h4>⚡ Quick Demo Logins (Click to Autofill &amp; Sign In)</h4>
        <div class="demo-btn-group">
          <button type="button" class="btn btn-secondary btn-sm" onclick="quickLogin('admin@marketplace.com', 'Admin@123')">
            🛡️ Admin
          </button>
          <button type="button" class="btn btn-secondary btn-sm" onclick="quickLogin('client@marketplace.com', 'Client@123')">
            💼 Client
          </button>
          <button type="button" class="btn btn-secondary btn-sm" onclick="quickLogin('freelancer@marketplace.com', 'Freelancer@123')">
            💻 Freelancer
          </button>
        </div>
      </div>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
        Don't have an account yet? <a href="/register.html" style="font-weight: 600;">Create an account</a>
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 FreelanceHub Platform. All rights reserved.</p>
    </div>
  </footer>

  <script src="/js/auth.js"></script>
  <script>
    async function quickLogin(email, pass) {
      document.getElementById('email').value = email;
      document.getElementById('password').value = pass;
      await performLogin(email, pass);
    }

    async function performLogin(email, password) {
      const submitBtn = document.getElementById('login-submit-btn');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Authenticating...';

      try {
        const data = await apiFetch('/auth/login', {
          method: 'POST',
          body: JSON.stringify({ email, password })
        });

        setToken(data.token);
        setCurrentUser(data.user);
        showToast(`Welcome back, ${data.user.fullName}!`, 'success');

        // Check if there is a redirect parameter
        const params = new URLSearchParams(window.location.search);
        const redirect = params.get('redirect');

        setTimeout(() => {
          if (redirect) {
            window.location.href = redirect;
          } else if (data.user.role === 'Admin') {
            window.location.href = '/admin-dashboard.html';
          } else if (data.user.role === 'Client') {
            window.location.href = '/client-dashboard.html';
          } else if (data.user.role === 'Freelancer') {
            window.location.href = '/freelancer-dashboard.html';
          } else {
            window.location.href = '/index.html';
          }
        }, 600);
      } catch (error) {
        showToast(error.message, 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
      }
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      await performLogin(email, password);
    });

    // If already logged in, redirect to appropriate dashboard
    document.addEventListener('DOMContentLoaded', () => {
      const user = getCurrentUser();
      const token = getToken();
      if (user && token) {
        if (user.role === 'Admin') window.location.href = '/admin-dashboard.html';
        else if (user.role === 'Client') window.location.href = '/client-dashboard.html';
        else if (user.role === 'Freelancer') window.location.href = '/freelancer-dashboard.html';
      }
    });
  </script>
</body>
</html>
