<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Review Applications - FreelanceHub</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="main-nav"></div>

  <div class="page-header">
    <div class="container">
      <div class="page-header-actions">
        <div>
          <h1>Review Received Proposals</h1>
          <p>Evaluate pitches, compare freelancer bids, and award projects.</p>
        </div>
        <a href="/client-dashboard.html" class="btn btn-secondary btn-sm">← Back to Dashboard</a>
      </div>
    </div>
  </div>

  <div class="container">
    <!-- Filter Bar -->
    <div class="filter-bar">
      <div class="filter-item" style="flex: 2;">
        <label class="form-label" for="filter-project-select">Filter by Project</label>
        <select id="filter-project-select" class="form-select">
          <option value="">All My Projects</option>
        </select>
      </div>

      <div class="filter-item">
        <label class="form-label" for="filter-app-status">Status</label>
        <select id="filter-app-status" class="form-select">
          <option value="all">All Statuses</option>
          <option value="Pending">Pending Review</option>
          <option value="Accepted">Accepted</option>
          <option value="Rejected">Rejected</option>
        </select>
      </div>
    </div>

    <!-- Applications List -->
    <div id="applications-list" style="margin-bottom: 4rem;">
      <div style="text-align: center; padding: 2rem;">Loading proposals...</div>
    </div>
  </div>

  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 FreelanceHub Platform. All rights reserved.</p>
    </div>
  </footer>

  <script src="/js/auth.js"></script>
  <script src="/js/client.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initClientApplications();
    });
  </script>
</body>
</html>
