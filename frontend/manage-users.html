<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Users - Admin Portal</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="main-nav"></div>

  <div class="page-header">
    <div class="container">
      <div class="page-header-actions">
        <div>
          <h1>User Account Management</h1>
          <p>Search, review, activate/deactivate, or remove client and freelancer accounts.</p>
        </div>
        <a href="/admin-dashboard.html" class="btn btn-secondary btn-sm">← Back to Analytics</a>
      </div>
    </div>
  </div>

  <div class="container">
    <!-- Filters -->
    <div class="filter-bar">
      <div class="filter-item" style="flex: 2;">
        <label class="form-label" for="user-search">Search Users</label>
        <input type="text" id="user-search" class="form-control" placeholder="Search by name or email...">
      </div>

      <div class="filter-item">
        <label class="form-label" for="user-role-filter">Filter by Role</label>
        <select id="user-role-filter" class="form-select">
          <option value="all">All Roles</option>
          <option value="Client">Clients</option>
          <option value="Freelancer">Freelancers</option>
          <option value="Admin">Admins</option>
        </select>
      </div>

      <div class="filter-item">
        <label class="form-label" for="user-status-filter">Account Status</label>
        <select id="user-status-filter" class="form-select">
          <option value="all">All Statuses</option>
          <option value="active">Active Accounts</option>
          <option value="inactive">Deactivated Accounts</option>
        </select>
      </div>
    </div>

    <div style="margin-bottom: 1rem; font-weight: 600; color: var(--text-muted);" id="user-count-display">
      Loading users...
    </div>

    <!-- Users Table -->
    <div class="card" style="margin-bottom: 4rem;">
      <div class="table-container" style="border: none; box-shadow: none; margin-bottom: 0;">
        <table class="table">
          <thead>
            <tr>
              <th>User Name &amp; Email</th>
              <th>Role</th>
              <th>Platform Activity</th>
              <th>Joined Date</th>
              <th>Status</th>
              <th>Moderation Actions</th>
            </tr>
          </thead>
          <tbody id="manage-users-body">
            <tr>
              <td colspan="6" style="text-align: center; padding: 2.5rem;">Loading user records...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 FreelanceHub Platform. All rights reserved.</p>
    </div>
  </footer>

  <script src="/js/auth.js"></script>
  <script src="/js/admin.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initManageUsers();
    });
  </script>
</body>
</html>
