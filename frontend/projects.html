<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Projects - FreelanceHub</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="main-nav"></div>

  <div class="page-header">
    <div class="container">
      <div class="page-header-actions">
        <div>
          <h1>Explore Project Opportunities</h1>
          <p>Discover high-paying contracts across web development, design, and architecture.</p>
        </div>
        <div id="client-post-cta" style="display: none;">
          <a href="/create-project.html" class="btn btn-primary">+ Post a New Project</a>
        </div>
      </div>
    </div>
  </div>

  <div class="container">
    <!-- Filter and Search Bar -->
    <div class="filter-bar">
      <div class="filter-item" style="flex: 2;">
        <label class="form-label" for="filter-search">Search Keywords</label>
        <input type="text" id="filter-search" class="form-control" placeholder="Search by title, skill (e.g. React, SQL)...">
      </div>

      <div class="filter-item">
        <label class="form-label" for="filter-category">Category</label>
        <select id="filter-category" class="form-select">
          <option value="all">All Categories</option>
          <option value="Web Development">Web Development</option>
          <option value="Backend Development">Backend Development</option>
          <option value="UI/UX Design">UI/UX Design</option>
          <option value="Database">Database</option>
          <option value="Design & Branding">Design & Branding</option>
        </select>
      </div>

      <div class="filter-item" style="max-width: 130px;">
        <label class="form-label" for="filter-min-budget">Min Budget ($)</label>
        <input type="number" id="filter-min-budget" class="form-control" placeholder="500" min="0">
      </div>

      <div class="filter-item" style="max-width: 130px;">
        <label class="form-label" for="filter-max-budget">Max Budget ($)</label>
        <input type="number" id="filter-max-budget" class="form-control" placeholder="10000" min="0">
      </div>

      <div class="filter-item">
        <label class="form-label" for="filter-sort">Sort By</label>
        <select id="filter-sort" class="form-select">
          <option value="newest">Newest First</option>
          <option value="budget_desc">Highest Budget</option>
          <option value="budget_asc">Lowest Budget</option>
          <option value="deadline">Soonest Deadline</option>
        </select>
      </div>

      <div style="display: flex; gap: 0.5rem; align-items: flex-end;">
        <button onclick="loadBrowseProjects()" class="btn btn-primary">Filter</button>
        <button onclick="resetFilters()" class="btn btn-outline" title="Reset Filters">↺</button>
      </div>
    </div>

    <!-- Active Count -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
      <span id="project-count" style="font-weight: 600; color: var(--text-muted);">Loading projects...</span>
    </div>

    <!-- Projects Grid -->
    <div id="projects-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 1.5rem; margin-bottom: 4rem;">
      <!-- Populated dynamically via projects.js -->
    </div>
  </div>

  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 FreelanceHub Platform. All rights reserved.</p>
    </div>
  </footer>

  <script src="/js/auth.js"></script>
  <script src="/js/projects.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const user = getCurrentUser();
      if (user && user.role === 'Client') {
        const cta = document.getElementById('client-post-cta');
        if (cta) cta.style.display = 'block';
      }

      loadBrowseProjects();

      // Live search with debounce
      const searchInput = document.getElementById('filter-search');
      if (searchInput) {
        let timeout;
        searchInput.addEventListener('input', () => {
          clearTimeout(timeout);
          timeout = setTimeout(loadBrowseProjects, 350);
        });
      }

      // Filter change listeners
      document.getElementById('filter-category').addEventListener('change', loadBrowseProjects);
      document.getElementById('filter-sort').addEventListener('change', loadBrowseProjects);
    });
  </script>
</body>
</html>
