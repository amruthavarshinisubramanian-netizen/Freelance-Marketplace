<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create an Account - FreelanceHub</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="main-nav"></div>

  <div class="auth-wrapper">
    <div class="auth-card">
      <h2>Create Your Account</h2>
      <p class="subtitle">Join the leading marketplace for freelance talent and clients</p>

      <form id="register-form">
        <div class="form-group">
          <label class="form-label" for="fullName">Full Name</label>
          <input type="text" id="fullName" class="form-control" placeholder="e.g. Jordan Lee" required autofocus>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Work Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="jordan@company.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password (minimum 6 characters)</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" minlength="6" required>
        </div>

        <div class="form-group">
          <label class="form-label">I want to join as:</label>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-top: 0.35rem;">
            <label style="border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 0.85rem; cursor: pointer; display: flex; align-items: center; gap: 0.5rem;" id="role-client-label">
              <input type="radio" name="role" value="Client" checked>
              <div>
                <strong>Client</strong>
                <div style="font-size: 0.75rem; color: var(--text-muted);">Hiring talent</div>
              </div>
            </label>
            <label style="border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 0.85rem; cursor: pointer; display: flex; align-items: center; gap: 0.5rem;" id="role-freelancer-label">
              <input type="radio" name="role" value="Freelancer">
              <div>
                <strong>Freelancer</strong>
                <div style="font-size: 0.75rem; color: var(--text-muted);">Looking for work</div>
              </div>
            </label>
          </div>
        </div>

        <button type="submit" id="register-submit-btn" class="btn btn-primary btn-block btn-lg" style="margin-top: 1rem;">
          Get Started Now
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
        Already have an account? <a href="/login.html" style="font-weight: 600;">Sign in</a>
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 FreelanceHub Platform. All rights reserved.</p>
    </div>
  </footer>

  <script src="/js/auth.js"></script>
  <script>
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const fullName = document.getElementById('fullName').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const role = document.querySelector('input[name="role"]:checked')?.value || 'Client';

      const submitBtn = document.getElementById('register-submit-btn');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating Account...';

      try {
        const data = await apiFetch('/auth/register', {
          method: 'POST',
          body: JSON.stringify({ fullName, email, password, role })
        });

        setToken(data.token);
        setCurrentUser(data.user);
        showToast('Account registered successfully! Welcome to FreelanceHub.', 'success');

        setTimeout(() => {
          if (role === 'Client') {
            window.location.href = '/client-dashboard.html';
          } else {
            window.location.href = '/freelancer-dashboard.html';
          }
        }, 800);
      } catch (error) {
        showToast(error.message, 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Get Started Now';
      }
    });
  </script>
</body>
</html>
