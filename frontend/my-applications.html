<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Applications - FreelanceHub</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="main-nav"></div>

  <div class="page-header">
    <div class="container">
      <div class="page-header-actions">
        <div>
          <h1>My Submitted Proposals</h1>
          <p>Track proposal status, bid amounts, and responses from clients in real time.</p>
        </div>
        <div style="display: flex; gap: 0.75rem;">
          <a href="/projects.html" class="btn btn-primary">Find More Work</a>
          <a href="/freelancer-dashboard.html" class="btn btn-secondary">Dashboard</a>
        </div>
      </div>
    </div>
  </div>

  <div class="container">
    <div style="margin-bottom: 1.5rem; font-weight: 600; color: var(--text-muted);" id="app-count-display">
      Loading applications...
    </div>

    <div class="card" style="margin-bottom: 4rem;">
      <div class="table-container" style="margin-bottom: 0; border: none; box-shadow: none;">
        <table class="table">
          <thead>
            <tr>
              <th>Project &amp; Client</th>
              <th>Client Budget</th>
              <th>My Bid</th>
              <th>Status</th>
              <th>Submitted Date</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="my-applications-body">
            <tr>
              <td colspan="6" style="text-align: center; padding: 2rem;">Loading your applications...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 FreelanceHub Platform. All rights reserved.</p>
    </div>
  </footer>

  <script src="/js/auth.js"></script>
  <script src="/js/freelancer.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initMyApplications();
    });
  </script>
</body>
</html>
